{% extends "base.html" %}
{% block content %}
<div class="dashboard">
    <h2>Add Citizen to Welfare Scheme</h2>
    <form action="{{ url_for('employee.submit_citizen_to_scheme') }}" method="POST">
        <div>
            <label for="citizen_id">Citizen ID:</label>
            <select id="citizen_id" name="citizen_id" required>
                <option value="">Select Citizen ID</option>
                {% for citizen in citizens %}
                <option value="{{ citizen.citizen_id }}">{{ citizen.citizen_id }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="scheme_id">Scheme ID:</label>
            <select id="scheme_id" name="scheme_id" required>
                <option value="">Select Scheme ID</option>
                {% for scheme in schemes %}
                <option value="{{ scheme.scheme_id }}">{{ scheme.scheme_id }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="date_of_enrollment">Date of Enrollment:</label>
            <input type="date" id="date_of_enrollment" name="date_of_enrollment" required>
        </div>
        <button type="submit">Submit</button>
    </form>
</div>
{% endblock %}
