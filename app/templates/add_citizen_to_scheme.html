{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">Add Citizen to Welfare Scheme</h2>
    </div>
    <div class="card-body">
      <form action="{{ url_for('employee.submit_citizen_to_scheme') }}" method="POST" id="schemeForm">
          <div class="mb-3">
              <label for="citizen_id" class="form-label">Citizen ID:</label>
              <select id="citizen_id" name="citizen_id" class="form-select" required>
                  <option value="">Select Citizen ID</option>
                  {% for citizen in citizens %}
                  <option value="{{ citizen.citizen_id }}">{{ citizen.citizen_id }}</option>
                  {% endfor %}
              </select>
          </div>
          <div class="mb-3">
              <label for="scheme_id" class="form-label">Scheme ID:</label>
              <select id="scheme_id" name="scheme_id" class="form-select" required>
                  <option value="">Select Scheme ID</option>
                  {% for scheme in schemes %}
                  <option value="{{ scheme.scheme_id }}">{{ scheme.scheme_id }}</option>
                  {% endfor %}
              </select>
          </div>
          <div class="mb-3">
              <label for="date_of_enrollment" class="form-label">Date of Enrollment:</label>
              <input type="date" id="date_of_enrollment" name="date_of_enrollment" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success">Submit</button>
      </form>
    </div>
  </div>
</div>
<script>
  // Simple JS to log the submission
  document.getElementById('schemeForm').addEventListener('submit', function(e){
      console.log("Scheme form submitted");
  });
</script>
{% endblock %}
