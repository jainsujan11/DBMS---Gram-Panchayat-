<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Citizen List</title>
</head>
<body>
    <h1>All Citizens</h1>
    {% if citizens %}
        <table border="1" cellpadding="5">
            <tr>
                <th>Citizen ID</th>
                <th>Name</th>
                <th>Gender</th>
            </tr>
            {% for citizen in citizens %}
            <tr>
                <td>{{ citizen[0] }}</td>  <!-- citizen_id -->
                <td>{{ citizen[1] }}</td>  <!-- name -->
                <td>{{ citizen[2] }}</td>  <!-- gender -->
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No citizens found.</p>
    {% endif %}
</body>
</html>
