{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <div class="card shadow">
    <div class="card-header bg-secondary text-white">
      <h2 class="mb-0">Year Wise Birth Rate</h2>
    </div>
    <div class="card-body">
      <canvas id="myChart" width="800" height="400"></canvas>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Parse data from Flask (JSON array of arrays)
    const dataFromServer = JSON.parse('{{ data | tojson | safe }}');
    const groupedData = {};
    dataFromServer.forEach(item => {
        const year = item[0];
        const gender = item[1];
        const count = item[2];
        if (!groupedData[year]) {
            groupedData[year] = { Male: 0, Female: 0 };
        }
        groupedData[year][gender] = count;
    });
    const labels = Object.keys(groupedData).sort();
    const maleData = labels.map(year => groupedData[year]['Male'] || 0);
    const femaleData = labels.map(year => groupedData[year]['Female'] || 0);
    const ctx = document.getElementById('myChart').getContext('2d');
    const myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Male',
                    data: maleData,
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                },
                {
                    label: 'Female',
                    data: femaleData,
                    backgroundColor: 'rgba(255, 99, 132, 0.6)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1
                }
            ]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            },
            responsive: true,
            plugins: {
                legend: { position: 'top' },
                title: { display: true, text: 'Birth Year and Gender Distribution' }
            }
        }
    });
</script>
{% endblock %}
