{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">Add Citizen Record</h2>
    </div>
    <div class="card-body">
      <form method="post" action="{{ url_for('employee.employee_add_citizen') }}" id="citizenForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username:</label>
          <input type="text" name="username" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">Name:</label>
          <input type="text" name="name" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="gender" class="form-label">Gender:</label>
          <select name="gender" id="gender" class="form-select">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="dob" class="form-label">Date of Birth:</label>
          <input type="date" name="dob" id="dob" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="educational_qualification" class="form-label">Educational Qualification:</label>
          <input type="text" name="educational_qualification" id="educational_qualification" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="household_id" class="form-label">Select Household:</label>
          <select name="household_id" id="household_id" class="form-select">
            {% for h in households %}
              <option value="{{ h.household_id }}">{{ h.address }} (Income: {{ h.income }})</option>
            {% endfor %}
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Add Citizen</button>
      </form>
    </div>
  </div>
</div>
<script>
  document.getElementById('citizenForm').addEventListener('submit', function(){
    console.log("Citizen form submitted");
  });
</script>
{% endblock %}
