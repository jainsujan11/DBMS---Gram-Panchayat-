{% extends "base.html" %}
{% block content %}
<div class="dashboard">
    <h2>Add Land Record</h2>
    <form method="post" action="{{ url_for('employee.employee_add_land') }}">
        <label>Select Citizen:</label><br>
        <select name="citizen_id">
            {% for c in citizens %}
                <option value="{{ c.citizen_id }}">{{ c.name }}</option>
            {% endfor %}
        </select><br>
        <label>Area (acres):</label><br>
        <input type="number" step="0.1" name="area_acres" required><br>
        <label>Crop Type:</label><br>
        <input type="text" name="crop_type" required><br><br>
        <button type="submit">Add Land Record</button>
    </form>
</div>
{% endblock %}
