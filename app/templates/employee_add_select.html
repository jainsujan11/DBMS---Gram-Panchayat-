{% extends "base.html" %}
{% block content %}
<div class="dashboard">
    <h2>Employee Add/Modify</h2>
    <ul>
        <li><a href="{{ url_for('employee.employee_add_citizen') }}">Add Citizen</a></li>
        <li><a href="{{ url_for('employee.employee_add_land') }}">Add Land Record</a></li>
        <li><a href="{{ url_for('employee.employee_add_asset') }}">Add Asset</a></li>
        <li>
            <!-- Form for Modify Citizen -->
            <form action="{{ url_for('employee.employee_modify_citizen') }}" method="GET" style="display: inline;">
                <label for="citizen_id">Citizen ID:</label>
                <input type="text" id="citizen_id" name="citizen_id" required>
                <button type="submit">Modify Citizen</button>
            </form>
        </li>
        <!-- You can add more options for schemes, vaccinations, etc. -->
    </ul>
</div>
{% endblock %}
