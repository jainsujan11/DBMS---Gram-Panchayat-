{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <div class="card shadow">
    <div class="card-header bg-info text-white">
      <h2 class="mb-0">Panchayat Employee Dashboard</h2>
    </div>
    <div class="card-body">
      <p>Please choose an option:</p>
      <div class="row">
        <div class="col-md-4 mb-3">
          <a href="{{ url_for('employee.employee_query_select') }}" class="btn btn-outline-secondary w-100">
            <i class="fas fa-search"></i> Query Data
          </a>
        </div>
        <div class="col-md-4 mb-3">
          <a href="{{ url_for('employee.employee_add_select') }}" class="btn btn-outline-success w-100">
            <i class="fas fa-edit"></i> Add / Modify Data
          </a>
        </div>
        <div class="col-md-4 mb-3">
          <a href="{{ url_for('employee.employee_add_citizen_to_scheme') }}" class="btn btn-outline-primary w-100">
            <i class="fas fa-user-plus"></i> Add Citizen to Scheme
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
