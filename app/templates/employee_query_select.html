{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">Employee Query - Select Category</h2>
    </div>
    <div class="card-body">
      <form method="post" action="{{ url_for('employee.employee_query_select') }}">
        <div class="mb-3">
          <label class="form-label">Select Query Category:</label>
          <select name="query_category" class="form-select">
            <option value="citizen">Citizen Queries</option>
            <option value="asset">Asset Queries</option>
            <option value="land">Land Queries</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Proceed</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
