{% extends "base.html" %}

{% block content %}
<div class="dashboard">
    <h2>Government Monitor Dashboard</h2>
    
    <div class="action-buttons">
        <!-- Add Welfare Scheme Button -->
        <form action="{{ url_for('govt.govt_add_scheme') }}" method="get">
            <button type="submit">Add Welfare Scheme</button>
        </form>

        <!-- Birth Rate Button -->
        <form action="{{ url_for('govt.govt_print_statistics') }}" method="post" style="display:block; margin-top:10px;">
            <button type="submit" name="which_query" value="Birth_Rate">Birth Rate Statistics</button>
        </form>

        <!-- Literacy Rate Button -->
        <form action="{{ url_for('govt.govt_print_statistics') }}" method="post" style="display:block; margin-top:10px;">
            <button type="submit" name="which_query" value="Literacy_Rate">Literacy Rate Statistics</button>
        </form>

        <!-- Assets Button -->
        <form action="{{ url_for('govt.govt_print_statistics') }}" method="post" style="display:block; margin-top:10px;">
            <button type="submit" name="which_query" value="Assets">Assets Statistics</button>
        </form>

        <!-- Poverty Line Button -->
        <form action="{{ url_for('govt.govt_print_statistics') }}" method="post" style="display:block; margin-top:10px;">
            <button type="submit" name="which_query" value="Poverty Line">Poverty Line Statistics</button>
        </form>

        <!-- Scheme Enrollments Button -->
        <form action="{{ url_for('govt.govt_print_statistics') }}" method="post" style="display:block; margin-top:10px;">
            <button type="submit" name="which_query" value="Scheme Enrollments">Scheme Enrollments Statistics</button>
        </form>
    </div>
</div>
{% endblock %}
