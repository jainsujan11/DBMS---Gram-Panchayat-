<!-- templates/add_scheme.html -->
{% extends "base.html" %}
{% block content %}
<div class="dashboard">
    <h2>Add New Scheme</h2>
    <form action="{{ url_for('govt.govt_add_scheme') }}" method="post">
        <div>
            <label for="scheme_number">Scheme Number:</label>
            <input type="number" id="scheme_number" name="scheme_number" required>
        </div>
        <div>
            <label for="scheme_name">Scheme Name:</label>
            <input type="text" id="scheme_name" name="scheme_name" required>
        </div>
        <div>
            <label for="scheme_description">Scheme Description:</label>
            <input type="text" id="scheme_description" name="scheme_description" required>
        </div>
        <button type="submit">Submit</button>
    </form>
</div>
{% endblock %}
