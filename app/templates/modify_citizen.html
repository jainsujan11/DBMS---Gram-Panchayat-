{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <div class="card shadow">
    <div class="card-header bg-warning text-dark">
      <h2 class="mb-0">Modify Citizen</h2>
    </div>
    <div class="card-body">
      <form action="{{ url_for('employee.update_citizen', citizen_id=citizen.citizen_id) }}" method="POST" id="modifyCitizenForm">
        <div class="mb-3">
          <label for="name" class="form-label">Name:</label>
          <input type="text" id="name" name="name" value="{{ citizen.name }}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="gender" class="form-label">Gender:</label>
          <input type="text" id="gender" name="gender" value="{{ citizen.gender }}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="dob" class="form-label">Date of Birth:</label>
          <input type="text" id="dob" name="dob" value="{{ citizen.dob }}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="household_id" class="form-label">Household ID:</label>
          <input type="number" id="household_id" name="household_id" value="{{ citizen.household_id }}" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="educational_qualification" class="form-label">Educational Qualification:</label>
          <input type="text" id="educational_qualification" name="educational_qualification" value="{{ citizen.educational_qualification }}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-warning">Update</button>
      </form>
    </div>
  </div>
</div>
<script>
  document.getElementById('modifyCitizenForm').addEventListener('submit', function(){
    console.log("Modify citizen form submitted");
  });
</script>
{% endblock %}
